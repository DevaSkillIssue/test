<script>

const T={carter:'#d98c3a',carn:'#4a7bd1',reporter:'#9b59b6',doc:'#2ecc71',crowd:'#7f8c8d',mosq:'#222'};
const S=[

 {t:19.2,bg:'#f2c98a',p:'4 · Carnarvon bercukur, gores gigitan',k:'MS → ECU pisau',it:[['box',150,120,90,150,'#9fc4d8'],['fig',110,300,1.2,T.carn],['blood',125,215],['mosq',190,90]],cam:[[110,420],[125,230]]},

];
const c=document.getElementById('c'),rows=Math.ceil(S.length/COLS);
c.width=COLS*(W+PAD)+PAD;c.height=rows*(H+CAP+PAD)+PAD;const g=c.getContext('2d');
function fig(x,y,s,col){g.fillStyle=col;g.beginPath();g.arc(x,y-70*s,16*s,0,7);g.fill();g.fillRect(x-14*s,y-52*s,28*s,52*s);g.fillRect(x-12*s,y,9*s,22*s);g.fillRect(x+3*s,y,9*s,22*s);}
function arrow(a,b){if(a[0]==b[0]&&a[1]==b[1]){g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(a[0]-12,a[1]-8,24,16);return;}
 g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();
 const an=Math.atan2(b[1]-a[1],b[0]-a[0]);g.beginPath();g.moveTo(...b);g.lineTo(b[0]-16*Math.cos(an-.5),b[1]-16*Math.sin(an-.5));g.lineTo(b[0]-16*Math.cos(an+.5),b[1]-16*Math.sin(an+.5));g.fill();}
S.forEach((s,i)=>{const ox=PAD+(i%COLS)*(W+PAD),oy=PAD+Math.floor(i/COLS)*(H+CAP+PAD);
 g.save();g.translate(ox,oy);g.beginPath();g.rect(0,0,W,H);g.clip();g.fillStyle=s.bg;g.fillRect(0,0,W,H);
 for(const it of s.it){const [t,x,y]=it;
  if(t=='box'){g.fillStyle=it[5];g.fillRect(x,y,it[3],it[4]);}
  if(t=='fig')fig(x,y,it[3],it[4]);
  if(t=='head'){g.fillStyle=it[4];g.beginPath();g.arc(x,y,it[3]/2,0,7);g.fill();}
  if(t=='mosq'){g.strokeStyle='#000';g.lineWidth=2;g.fillStyle='#000';g.beginPath();g.ellipse(x,y,7,3,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(x-3,y-6,6,3,-.5,0,7);g.ellipse(x+3,y-6,6,3,.5,0,7);g.fill();}
  if(t=='blood'){g.fillStyle='#c0392b';g.beginPath();g.arc(x,y,5,0,7);g.fill();}
  if(t=='glow'){g.fillStyle='rgba(255,220,120,.7)';g.beginPath();g.arc(x,y,14,0,7);g.fill();}
  if(t=='paper'){g.fillStyle='#f5f0e0';g.fillRect(x,y,45,60);g.fillStyle='#333';for(let k=0;k<5;k++)g.fillRect(x+5,y+8+k*10,35,3);}
  if(t=='glyph'){g.fillStyle=it[3];for(let k=0;k<4;k++){g.fillRect(x-40,y-50+k*28,14,14);g.beginPath();g.arc(x,y-43+k*28,7,0,7);g.fill();g.fillRect(x+24,y-50+k*28,6,18);}}
  if(t=='bubble'){g.fillStyle='#fff';g.beginPath();g.ellipse(x,y,26,16,0,0,7);g.fill();g.fillStyle='#e74c3c';g.font='bold 18px sans-serif';g.fillText('!!',x-8,y+6);}
 }
 arrow(...s.cam);
 // Shorts safe zone guide (top 8, right 16, bottom 25, left 4 %)
 g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([5,5]);g.lineWidth=1;g.strokeRect(W*.04,H*.08,W*.80,H*.67);g.setLineDash([]);
 g.restore();
 g.fillStyle='#eee';g.font='bold 14px sans-serif';g.fillText(s.p,ox,oy+H+18);
 g.fillStyle='#aaa';g.font='13px sans-serif';g.fillText(s.t.toFixed(2)+' s · '+s.k,ox,oy+H+37);
});
</script>
