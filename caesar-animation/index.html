<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stickman Preview</title>
  <script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
  <style>
    :root { color-scheme: dark; --bg:#0f1115; --panel:#1a1d24; --text:#e8eaed; --muted:#9aa0a6; --accent:#ffd400; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif;
           display:flex; flex-direction:column; align-items:center; min-height:100dvh; padding:12px 16px 20px; gap:10px; }
    h1 { font-size:16px; margin:0; font-weight:600; }
    .frame { width:min(100%, calc((100dvh - 190px) * 9 / 16)); aspect-ratio:9/16; background:#000; border-radius:12px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; }
    .controls { width:min(100%, 480px); display:flex; gap:10px; align-items:center; }
    button { background:var(--panel); color:var(--text); border:1px solid #333; border-radius:8px; padding:10px 14px; font:inherit; min-height:44px; }
    #play { background:var(--accent); color:#000; border:none; font-weight:600; min-width:76px; }
    input[type=range] { flex:1; accent-color:var(--accent); min-height:44px; }
    #time { font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; min-width:92px; text-align:right; }
    #scenes { width:min(100%, 480px); display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
    #scenes button { padding:6px 10px; min-height:36px; font-size:12px; white-space:nowrap; }
    #status { color:var(--muted); font-size:12px; text-align:center; width:min(100%, 480px); }
  </style>
</head>
<body data-mode="preview">
  <h1>2.5D Stickman Preview</h1>
  <div class="frame"><canvas id="stage"></canvas></div>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Timeline position">
    <span id="time">0.00s</span>
  </div>
  <div id="scenes" aria-label="Jump to scene"></div>
  <div id="status" role="status">Loading…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
